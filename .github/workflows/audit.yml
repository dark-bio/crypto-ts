name: audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check npm dependencies against the GitHub advisory database
        run: npm audit

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Check Rust dependencies against the RustSec advisory database
        run: cargo audit --file crates/wasm/Cargo.lock

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check npm dependency licenses against the allowlist
        run: npx --yes license-checker-rseidelsohn --production --onlyAllow '0BSD;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;MIT;Unicode-3.0;Zlib'

      - name: Check Rust dependency licenses against the allowlist
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/wasm/Cargo.toml
          arguments: --all-features --config crates/wasm/.cargo/deny.toml
          command: check licenses
