[package]
name = "darkbio-crypto-wasm"
version = "0.19.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
darkbio-crypto = { version = "0.19.1", features = ["rand", "hkdf", "argon2", "cose", "cwt"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
zeroize = "1.9"

[profile.release]
opt-level = "s"
lto = true
